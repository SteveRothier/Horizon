<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <defs>
    <linearGradient id="glass-bg" x1="16" y1="0" x2="16" y2="32" gradientUnits="userSpaceOnUse">
      <stop stop-color="#1a2744"/>
      <stop offset="1" stop-color="#0b1226"/>
    </linearGradient>
    <linearGradient id="glass-shine" x1="16" y1="1" x2="16" y2="16" gradientUnits="userSpaceOnUse">
      <stop stop-color="#ffffff" stop-opacity="0.14"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="sky-glow" x1="16" y1="6" x2="16" y2="20" gradientUnits="userSpaceOnUse">
      <stop stop-color="#f5c542" stop-opacity="0"/>
      <stop offset="0.55" stop-color="#f5c542" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#f5c542" stop-opacity="0.08"/>
    </linearGradient>
    <linearGradient id="sun-fill" x1="16" y1="10" x2="16" y2="20" gradientUnits="userSpaceOnUse">
      <stop stop-color="#ffe59a"/>
      <stop offset="1" stop-color="#f0a830"/>
    </linearGradient>
    <clipPath id="icon-clip">
      <rect width="32" height="32" rx="8"/>
    </clipPath>
  </defs>
  <g clip-path="url(#icon-clip)">
    <rect width="32" height="32" rx="8" fill="url(#glass-bg)"/>
    <rect width="32" height="32" rx="8" fill="url(#glass-shine)"/>
    <rect
      x="0.75"
      y="0.75"
      width="30.5"
      height="30.5"
      rx="7.25"
      fill="none"
      stroke="rgba(255,255,255,0.28)"
      stroke-width="1"
    />
    <!-- Atmospheric glow above the horizon -->
    <ellipse cx="16" cy="20" rx="11" ry="8" fill="url(#sky-glow)"/>
    <!-- Rising half-sun (full circle masked by the ground bar below) -->
    <circle cx="16" cy="20" r="6.5" fill="url(#sun-fill)"/>
    <!-- Solid ground / horizon plane covering the lower half of the sun -->
    <rect x="3" y="20" width="26" height="9" rx="1.5" fill="#0b1226"/>
    <rect x="3" y="20" width="26" height="2" rx="1" fill="#9ec9f0" fill-opacity="0.9"/>
  </g>
</svg>
